# A zirc server of your own (README.md), linked to your organisation on zirc.dev: people,
# invites and signing in stay at zirc.dev, and what they say and share stays here.
#
# Make the organisation at zirc.dev "on my own server", with this machine's host name; it
# gives a join token. Point the host name at this machine, open ports 80, 443 and 6697, set
# the three values below, then:
#
#   docker compose up -d
#
# On its first start the server joins the organisation, and you invite people at zirc.dev.
#
# Behind a proxy that ends TLS itself: set ZIRC_TLS to "off", have the proxy send 6697 to the
# container's 6667 and 443 to its 8080, ZIRC_PROXY_PROTOCOL to "true" if the proxy sends a
# PROXY header, and ZIRC_PUBLIC_IRC_PORT to the proxy's IRC port if it isn't 6697.
services:
  zirc:
    image: ghcr.io/zircd/zirc-server:latest
    restart: unless-stopped
    environment:
      # The host name people connect to; Let's Encrypt's certificate is for it.
      ZIRC_HOST: irc.example.com
      # Where Let's Encrypt writes about the certificate, such as before it runs out.
      ZIRC_ACME_EMAIL: you@example.com
      # The join token zirc.dev gave when you made the organisation; used once.
      ZIRC_JOIN_TOKEN: paste-it-here
      # The media container, below: its imgproxy resizes the images people share for the
      # screens showing them, and its worker makes videos' posters and the copies people
      # play. Without them, images are served as sent and video is a file to download.
      ZIRC_IMGPROXY: http://media:8081
      ZIRC_MEDIA_WORKER: http://media:8080
      # Files are kept in the data volume. To keep them in an S3 bucket of your own instead
      # (any S3-compatible service), set these, with a key that may read, write, list and
      # delete in that bucket alone:
      # ZIRC_S3_BUCKET: acme-zirc-files
      # ZIRC_S3_ENDPOINT: https://s3.eu-west-2.amazonaws.com
      # ZIRC_S3_REGION: eu-west-2
      # AWS_ACCESS_KEY_ID: ...
      # AWS_SECRET_ACCESS_KEY: ...
    ports:
      # Let's Encrypt's challenge, as it gets and renews the certificate; else to HTTPS.
      - "80:80"
      # zirc.dev manages the server here, and apps read history and files from it.
      - "443:443"
      # IRC over TLS, for every app and machine.
      - "6697:6697"
    volumes:
      # Everything the server keeps: accounts, history, files, its secrets and certificate.
      - zirc-data:/data

  # Everything that reads what people share, for the server alone and apart from what it
  # keeps: imgproxy, which resizes images, and zirc's media worker, which makes videos'
  # posters and the copies people play. Each reads an original from a link the server
  # signed, which lasts minutes, and what they make leaves out its metadata, location
  # included. Nothing else reaches it. For amd64 machines.
  media:
    image: ghcr.io/zircd/zirc-media:latest
    restart: unless-stopped

volumes:
  zirc-data:
