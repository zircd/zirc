[package]
name = "zirc-media-worker"
description = "Video for zirc's files: probes uploads and makes posters and web-playable copies with ffmpeg, as zirc.dev asks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "zirc-media-worker"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
clap = { version = "4", features = ["derive", "env"] }
reqwest = { workspace = true, features = ["stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde.workspace = true
serde_json = "1"
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "net", "process", "rt-multi-thread", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["json"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
