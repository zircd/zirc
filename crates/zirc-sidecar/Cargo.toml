[package]
name = "zirc-sidecar"
description = "The sidecar that runs beside each zirc server's Ergo: its account endpoint, history search, usage counts and metrics."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
base64.workspace = true
bcrypt = "0.19"
clap.workspace = true
futures.workspace = true
jiff = "0.2"
notify.workspace = true
p256.workspace = true
prometheus-client = "0.25"
rand = "0.10"
ring.workspace = true
# reqwest comes without a TLS provider (zirc's workspace pins it so); ring is installed.
rustls.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["json"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true
zirc-chat.workspace = true
zirc-irc.workspace = true
zirc-proto.workspace = true

[dev-dependencies]
tempfile.workspace = true
zirc-test-ergo.workspace = true
zirc-test-irc.workspace = true
